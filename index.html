<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa-Futurama</title>
</head>

<body>
    <header>
        <h1>Pesquisa Futurama</h1>
    </header>
    <section>
        <form action="" method="get">
            <!-- DADOS PESSOAIS -->

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="userName">Nome</label>
                <input type="text" name="userName" required>
                <br>
                <label for="userAge">Idade</label>
                <input type="number" name="userAge" min="12" max="100" required>
<br>
                <label for="birthDate">Data de nacimento</label>
                <input type="date" name="birthDate">
<br>
                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" required>
<br>
                <label for="userPhoneNumber">Telefone</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="62999999999">
<br>
                <label for="userImage">Upload de foto</label>
                <input type="file" name="userImage">
            </fieldset>

            <button type="submit">Enviar</button>
        </form>
    </section>
</body>

</html>
